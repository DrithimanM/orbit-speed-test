<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1360" viewBox="0 0 1680 1360" role="img" aria-labelledby="title desc">
<title id="title">Orbit Network Observatory — implementation architecture</title>
<desc id="desc">GitHub Actions verifies the source and deploys static assets to GitHub Pages. In the user's browser, the interface connects to a measurement coordinator, derived measurement helpers, and IndexedDB history. Reviewed requests go directly to public speed-test servers, and Cloudflare or RIPEstat for identity. Manual city and network inputs stay local. A service worker caches only the app shell. Test traffic bypasses that cache.</desc>
