<text x="108" y="485" font-size="12" fill="#64e6d4" font-weight="600">PRESENTATION</text>
<text x="108" y="515" font-size="23" font-weight="600">Interface</text>
<text x="108" y="542" font-size="16" class="sub">index.html · styles.css · ui.js</text>
<text x="108" y="567" font-size="16" class="sub">Views, controls, live graphs</text>
<text x="108" y="592" font-size="16" class="sub">JSON / CSV + clipboard</text>
<rect x="404" y="456" width="384" height="190" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="404" y="476" width="3" height="150" rx="1.5" fill="#64e6d4"/>
<text x="424" y="485" font-size="12" fill="#64e6d4" font-weight="600">COORDINATOR · APP.JS</text>
<text x="424" y="515" font-size="21" font-weight="600">Measurement engine</text>
<text x="424" y="542" font-size="16" class="sub">Discover and rank reachable servers</text>
<text x="424" y="567" font-size="16" class="sub">Idle RTT → download → upload</text>
<text x="424" y="592" font-size="16" class="sub">Parallel HTTP transfers + loaded RTT</text>
<text x="424" y="617" font-size="16" class="sub">Retries, cancellation, attempt state</text>
<rect x="842" y="456" width="274" height="190" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="842" y="476" width="3" height="150" rx="1.5" fill="#64e6d4"/>
<text x="862" y="485" font-size="12" fill="#64e6d4" font-weight="600">APP.JS + SECURITY.JS</text>
<text x="862" y="515" font-size="21" font-weight="600">Request boundary</text>
<text x="862" y="542" font-size="16" class="sub">Reviewed endpoint URLs</text>
<text x="862" y="567" font-size="16" class="sub">Bounded response bodies</text>
<text x="862" y="592" font-size="16" class="sub">Timeout / abort · no redirects</text>
<text x="862" y="617" font-size="16" class="sub">No credentials · no-store</text>
<rect x="88" y="715" width="262" height="160" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="88" y="735" width="3" height="120" rx="1.5" fill="#64e6d4"/>
<text x="108" y="744" font-size="12" fill="#64e6d4" font-weight="600">CORE.JS + TELEMETRY.JS</text>
<text x="108" y="774" font-size="21" font-weight="600">Derived metrics</text>
<text x="108" y="801" font-size="16" class="sub">Median, jitter, percentiles</text>
<text x="108" y="826" font-size="16" class="sub">Readiness + loaded delta</text>
<text x="108" y="851" font-size="16" class="sub">Distance + report formats</text>
<rect x="404" y="715" width="384" height="160" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="404" y="735" width="3" height="120" rx="1.5" fill="#b5a3ff"/>
<text x="424" y="744" font-size="12" fill="#b5a3ff" font-weight="600">LOCAL PERSISTENCE</text>
<text x="424" y="774" font-size="21" font-weight="600">IndexedDB history</text>
<text x="424" y="801" font-size="16" class="sub">orbit-speed-test / tests</text>
<text x="424" y="826" font-size="16" class="sub">Completed + interrupted attempts</text>
<text x="424" y="851" font-size="16" class="sub">Measurements, traces, access-type label</text>
<rect x="842" y="715" width="274" height="160" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="842" y="735" width="3" height="120" rx="1.5" fill="#64e6d4"/>
<text x="862" y="744" font-size="12" fill="#64e6d4" font-weight="600">BROWSER INPUTS</text>
<text x="862" y="774" font-size="21" font-weight="600">Location &amp; access</text>
<text x="862" y="801" font-size="16" class="sub">Manual city + network API</text>
<text x="862" y="826" font-size="16" class="sub">Timezone / manual region</text>
<text x="862" y="851" font-size="16" class="sub">Context stays in tab memory</text>
<text x="88" y="932" font-size="12" fill="#b5a3ff" font-weight="600">OFFLINE &amp; INSTALLATION</text>
<rect x="88" y="967" width="650" height="150" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="88" y="987" width="3" height="110" rx="1.5" fill="#b5a3ff"/>
<text x="108" y="996" font-size="12" fill="#b5a3ff" font-weight="600">PWA.JS · MANIFEST · SW.JS</text>
<text x="108" y="1026" font-size="21" font-weight="600">Installable app + service worker</text>
<text x="108" y="1053" font-size="16" class="sub">Register worker; cache exact same-origin GET shell assets</text>
<text x="108" y="1078" font-size="16" class="sub">Offline history remains available; live tests require internet</text>
<text x="108" y="1103" font-size="16" class="sub">Updates wait until all Orbit windows are closed</text>
<rect x="842" y="967" width="274" height="150" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="842" y="987" width="3" height="110" rx="1.5" fill="#b5a3ff"/>
<text x="862" y="996" font-size="12" fill="#b5a3ff" font-weight="600">CACHE STORAGE</text>
<text x="862" y="1026" font-size="21" font-weight="600">Offline app shell</text>
<text x="862" y="1053" font-size="16" class="sub">Versioned HTML / CSS / JS</text>
<text x="862" y="1078" font-size="16" class="sub">Icons + bundled catalog</text>
<text x="862" y="1103" font-size="16" class="sub">No external test traffic</text>
<rect x="1240" y="476" width="364" height="140" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="1240" y="496" width="3" height="100" rx="1.5" fill="#8bb7ff"/>
<text x="1260" y="505" font-size="12" fill="#8bb7ff" font-weight="600">SERVER DISCOVERY</text>
<text x="1260" y="535" font-size="21" font-weight="600">Reviewed route catalog</text>
<text x="1260" y="562" font-size="16" class="sub">Local servers.json asset only</text>
<text x="1260" y="587" font-size="16" class="sub">Catalogs cannot expand allowlist</text>
<rect x="1240" y="715" width="364" height="174" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="1240" y="735" width="3" height="134" rx="1.5" fill="#8bb7ff"/>
<text x="1260" y="744" font-size="12" fill="#8bb7ff" font-weight="600">MEASUREMENT TRAFFIC</text>
<text x="1260" y="774" font-size="21" font-weight="600">Speed-test endpoints</text>
<text x="1260" y="801" font-size="16" class="sub">LibreSpeed-compatible hosts:</text>
<text x="1260" y="826" font-size="16" class="sub">Clouvider, Sharktech, community</text>
<text x="1260" y="851" font-size="16" class="sub">Plus Cloudflare’s routed edge</text>
<text x="1260" y="876" font-size="16" class="sub">HTTP RTT + download / upload</text>
<rect x="1240" y="986" width="364" height="142" rx="18" fill="#141e28" stroke="#2b3949"/>
<rect x="1240" y="1006" width="3" height="102" rx="1.5" fill="#8bb7ff"/>
<text x="1260" y="1015" font-size="12" fill="#8bb7ff" font-weight="600">CURRENT CONNECTION IDENTITY</text>
<text x="1260" y="1045" font-size="20" font-weight="600">Cloudflare + RIPEstat</text>
<text x="1260" y="1072" font-size="16" class="sub">Public IP, ASN, network holder</text>
<text x="1260" y="1097" font-size="16" class="sub">IP is sent to RIPEstat for lookup</text>
<text x="88" y="1144" font-size="14" class="muted">Measurement helpers run in the page; the browser manages TCP / QUIC connections.</text>
<rect x="48" y="1192" width="776" height="116" rx="16" fill="#151b26" stroke="#293646"/>
<text x="72" y="1222" font-size="12" fill="#b5a3ff" font-weight="600">PERSISTENCE BOUNDARY</text>
<text x="72" y="1249" font-size="16" class="sub">Saved history contains test results and an access-type snapshot.</text>
<text x="72" y="1274" font-size="16" class="sub">Public IP, ASN, ISP and location are excluded from history and exports.</text>
<rect x="850" y="1192" width="782" height="116" rx="16" fill="#151b26" stroke="#293646"/>
<text x="874" y="1222" font-size="12" fill="#64e6d4" font-weight="600">MEASUREMENT CONTRACT</text>
<text x="874" y="1249" font-size="16" class="sub">10 idle samples → 5/15 s per direction; 1 or 3 HTTP streams.</text>
<text x="874" y="1274" font-size="16" class="sub">Sustained Mbps = completed payload bits / full elapsed phase time.</text>
<text x="48" y="1340" font-size="13" class="muted">Implementation view · arrows show principal data flows; see architecture.md for module responsibilities and trust boundaries.</text>
<text x="1442" y="1340" font-size="13" class="muted">Developed by HigherIyer</text>
